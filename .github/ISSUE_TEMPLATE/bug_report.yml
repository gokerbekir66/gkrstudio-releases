name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please update to the latest version first (Settings → Check for updates). Don't attach private files.
  - type: input
    id: version
    attributes:
      label: GKR Studio version
      description: Settings → Updates
      placeholder: "1.3.8"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: What did you use?
      description: File type and wheel slice
      placeholder: "PDF → Convert → DOCX"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or log
      description: A screenshot of the error. On macOS also the last lines of ~/Library/Logs/GKRStudio.log.
